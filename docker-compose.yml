services:
  postgres:
    image: postgres:17-alpine
    container_name: seatlock-postgres

    environment:
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: seatlock
      POSTGRES_DB: seatlock

    ports:
      - '5432:5432'

    volumes:
      - seatlock_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: seatlock-redis

    ports:
      - '6379:6379'

    volumes:
      - seatlock_redis_data:/data

  kafka:
    image: apache/kafka:4.1.0
    container_name: seatlock-kafka

    ports:
      - '9092:9092'

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  nginx:
    image: nginx:alpine
    container_name: seatlock-nginx
    ports:
      - '8080:80'
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
volumes:
  seatlock_postgres_data:
  seatlock_redis_data:
